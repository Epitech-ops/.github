version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Minor and patch bumps ship together; majors stay out of
      # the group so each one gets its own PR.
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
